<section class="page-heading">
  <p class="eyebrow">Cashier</p>
  <h1>Billing queue</h1>
  <p>Cashier and manager roles can open bills, collect payments, and settle table orders.</p>
</section>

<section class="bill-grid">
  <p class="error" *ngIf="saveError">{{ saveError }}</p>

  <app-card *ngFor="let order of activeOrders">
      <p class="meta">Payment pending</p>
      <h2>Order #{{ order.Id }}</h2>
      <strong>{{ order.OrderDate | date : 'medium' }}</strong>
      <app-button variant="secondary" (clicked)="settleBill(order)">Settle bill</app-button>
  </app-card>
</section>
