<section class="menu-page">
  <header class="page-heading">
    <p class="eyebrow">Menu</p>
    <h1>All products by category</h1>
    <p>Browse all menu products grouped category-wise.</p>
  </header>

  <section class="category-filter">
    <button [class.active]="selectedCategoryId === null" (click)="setCategory(null)">All</button>
    <button
      *ngFor="let category of categories"
      [class.active]="selectedCategoryId === category.Id"
      (click)="setCategory(category.Id!!)"
    >
      {{ category.Name }}
    </button>
  </section>

  <section *ngFor="let group of groupedFoods" class="category-block">
    <h2>{{ group.category?.Name || 'Uncategorized' }}</h2>

    <div class="food-grid">
      <article class="food-card" *ngFor="let item of group.items">
        <img [src]="'https://picsum.photos/seed/' + item.Id + '/600/400'" alt="food image" />

        <div class="food-info">
          <div class="title-row">
            <h3>{{ item.Name }}</h3>
            <span>₹{{ item.Price }}</span>
          </div>

          <p>{{ item.Description || 'Freshly prepared.' }}</p>
          <button class="add-btn" (click)="addToOrder(item)">Add to order</button>
        </div>
      </article>
    </div>
  </section>
</section>
