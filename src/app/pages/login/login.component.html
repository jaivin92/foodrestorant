<section class="login-page">
  <app-card>
    <p class="eyebrow">Secure entry</p>
    <h1>Login to continue</h1>
    <p class="intro">Choose a role to preview the matching drawer menu, dashboard modules, and protected restaurant workflow.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <app-input id="email" label="Email" type="email" autocomplete="email" formControlName="email" />
      <app-input id="password" label="Password" type="password" autocomplete="current-password" formControlName="password" />

      <fieldset>
        <legend>Role</legend>
        @for (role of roles; track role.value) {
          <label>
            <input type="radio" [value]="role.value" formControlName="role" />
            {{ role.label }}
          </label>
        }
      </fieldset>

      <app-button type="submit" [disabled]="form.invalid">Login</app-button>
    </form>
  </app-card>
</section>
