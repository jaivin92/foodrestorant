@if (auth.isAuthenticated()) {
  <app-header />
  <div class="app-layout" [class.app-layout--drawer-open]="layout.drawerOpen()">
    <main class="app-shell app-shell--with-drawer">
      <router-outlet />
    </main>
    <app-drawer />
  </div>
  <app-footer />
} @else {
  <main class="auth-shell">
    <router-outlet />
  </main>
}
